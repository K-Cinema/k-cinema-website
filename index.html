<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Cinema | (주)케이시네마</title>
    <meta name="description" content="K-Cinema (주)케이시네마 - OPEN 준비 중">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .opening-soon {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 900;
            font-style: italic;
            color: #000;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        .logo-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 80px;
            flex-wrap: wrap;
        }

        .logo img {
            height: 80px;
            width: auto;
        }

        .company-name-ko {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            color: #000;
            white-space: nowrap;
        }

        .footer-info {
            font-size: clamp(14px, 3vw, 18px);
            color: #333;
            line-height: 1.8;
        }

        .footer-info .address {
            margin-bottom: 5px;
        }

        .footer-info .contact {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .footer-info a {
            color: #333;
            text-decoration: none;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .logo-section {
                flex-direction: column;
                gap: 30px;
                margin-bottom: 60px;
            }

            .opening-soon {
                margin-bottom: 40px;
            }

            .footer-info .contact {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="opening-soon">OPEN 준비 중 !</h1>

        <div class="logo-section">
            <div class="logo">
                <img src="logo.png" alt="K-Cinema 로고">
            </div>
            <div class="company-name-ko">(주)케이시네마</div>
        </div>

        <div class="footer-info">
            <p class="address">서울시 영등포구 여의도동 국회대로 74길 20 맨하탄21 리빙텔 517호</p>
            <div class="contact">
                <a href="https://www.k-cine.com" target="_blank">www.k-cine.com</a>
                <span>M : 010-6343-6316</span>
            </div>
        </div>
    </div>
</body>
</html>
